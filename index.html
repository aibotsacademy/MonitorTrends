<title>Pulso Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: una pantalla a la vez. Barra superior con riel de 5 pasos; cada pantalla entra con un movimiento de cámara (profundidad + enfoque) y avanza sola al completarse */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --raised:#F9FAFB; --sunk:#E8EAEE; --ink:#0C0E13; --muted:#5A6070; --faint:#8C92A1; --line:#E0E3E9;
  --accent:#2B45F0; --accent-ink:#FFFFFF; --accent-soft:#E7EBFE;
  --ok:#11845A; --ok-soft:#DDF2E9; --warn:#A86500; --warn-soft:#FAEED8; --bad:#CF3626; --bad-soft:#FBE3DF;
  --shadow:0 1px 2px rgba(12,14,19,.05),0 10px 30px -10px rgba(12,14,19,.12);
  --shadow-lift:0 2px 4px rgba(12,14,19,.06),0 24px 48px -16px rgba(12,14,19,.22);
  --f-ui:"Geist","Helvetica Neue","Segoe UI",system-ui,sans-serif;
  --f-serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --f-mono:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;
  --expo:cubic-bezier(.16,1,.3,1); --in:cubic-bezier(.7,0,.84,0); --spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0B0E; --surface:#13151A; --raised:#181B21; --sunk:#1D2027; --ink:#F1F2F5; --muted:#A1A7B5; --faint:#6C7282; --line:#262A33;
  --accent:#7088FF; --accent-ink:#0A0B0E; --accent-soft:#1B2251;
  --ok:#3DC48D; --ok-soft:#0F2A20; --warn:#E3A647; --warn-soft:#2C2312; --bad:#F06A5A; --bad-soft:#341815;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -10px rgba(0,0,0,.6); --shadow-lift:0 2px 4px rgba(0,0,0,.4),0 24px 48px -16px rgba(0,0,0,.8);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0B0E; --surface:#13151A; --raised:#181B21; --sunk:#1D2027; --ink:#F1F2F5; --muted:#A1A7B5; --faint:#6C7282; --line:#262A33;
  --accent:#7088FF; --accent-ink:#0A0B0E; --accent-soft:#1B2251;
  --ok:#3DC48D; --ok-soft:#0F2A20; --warn:#E3A647; --warn-soft:#2C2312; --bad:#F06A5A; --bad-soft:#341815;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -10px rgba(0,0,0,.6); --shadow-lift:0 2px 4px rgba(0,0,0,.4),0 24px 48px -16px rgba(0,0,0,.8);
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;overflow-x:hidden}
img{max-width:100%}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.mono{font-family:var(--f-mono)} .num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}

/* Barra superior */
.top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:20px;height:68px;max-width:1120px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem;letter-spacing:-.02em}
.mark{position:relative;width:20px;height:20px;border-radius:50%;background:var(--ink)}
.mark::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--accent);animation:beat 2.4s var(--expo) infinite}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.35)}24%{transform:scale(1)}}
.rail{position:relative;justify-self:center;display:flex;list-style:none;margin:0;padding:0;min-width:0;max-width:100%}
.rail::before{content:"";position:absolute;top:15px;left:46px;right:46px;height:2px;border-radius:2px;background:var(--line)}
.rail .fill{position:absolute;top:15px;height:2px;border-radius:2px;background:var(--ink);width:0;transition:width .9s var(--expo),left .9s var(--expo)}
.node{position:relative;z-index:1;width:92px}
.node button{width:100%;display:flex;flex-direction:column;align-items:center;gap:7px;border:0;background:none;padding:6px 0;cursor:pointer}
.node .dot{width:18px;height:18px;border-radius:50%;background:var(--bg);border:2px solid var(--line);display:grid;place-items:center;transition:all .5s var(--expo)}
.node .dot svg{width:10px;height:10px;opacity:0;transform:scale(.4);transition:all .4s var(--spring)}
.node .lbl{font-size:.74rem;color:var(--faint);font-weight:500;transition:color .3s}
.node.done .dot{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.node.done .dot svg{opacity:1;transform:none}
.node.cur .dot{border-color:var(--accent);background:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.node.cur .lbl{color:var(--ink);font-weight:600}
.node.done .lbl{color:var(--muted)}
.node.locked button{cursor:not-allowed}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.top-right{display:flex;align-items:center;gap:10px;justify-self:end}
.credits{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.84rem;font-weight:500}
.credits b{font-family:var(--f-mono);font-weight:500}
.avatar{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:.85rem;transition:transform .3s var(--spring)}
.avatar:hover{transform:scale(1.06)}
.menu{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:62px;z-index:40;min-width:240px;padding:6px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-lift);transform-origin:top right}
.menu .who{padding:10px 12px 8px;font-size:.8rem;color:var(--muted);border-bottom:1px solid var(--line);margin-bottom:4px;word-break:break-all}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:9px;cursor:pointer;font-size:.9rem}
.menu button:hover{background:var(--sunk)}

/* Escenario */
.stage{position:relative;max-width:1120px;margin:0 auto}
.screen{padding-block:44px 140px;display:flex;flex-direction:column;gap:28px;transform-origin:50% 0}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.eyebrow::before{content:"";width:18px;height:2px;border-radius:2px;background:var(--accent)}
.hl{font-size:clamp(2.3rem,6.2vw,4.5rem);font-weight:600;letter-spacing:-.04em;line-height:1.02;max-width:16ch}
.hl.sm{font-size:clamp(2rem,4.6vw,3.3rem);max-width:22ch}
.hl em{font-family:var(--f-serif);font-style:italic;font-weight:400;letter-spacing:-.01em;color:var(--accent)}
.hl .ln{display:block;overflow:hidden;padding-bottom:.1em;margin-bottom:-.1em}
.hl .ln>span{display:inline-block}
.lede{font-size:1.1rem;color:var(--muted);max-width:56ch}
.head{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}

/* Botones */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:10px;height:48px;padding:0 22px;border-radius:999px;border:1px solid var(--line);text-decoration:none;
  background:var(--surface);color:var(--ink);cursor:pointer;font-weight:600;font-size:.94rem;white-space:nowrap;transition:transform .35s var(--spring),box-shadow .3s,background .3s,border-color .3s,color .3s}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:var(--shadow)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover:not(:disabled){color:var(--ink);box-shadow:none;background:var(--sunk)}
.btn.sm{height:36px;padding:0 14px;font-size:.84rem}
.btn.warn{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn .arrow{transition:transform .35s var(--spring)}
.btn:hover:not(:disabled) .arrow{transform:translateX(4px)}
.btn.is-busy{pointer-events:none}
.btn.is-done{background:var(--ok)!important;border-color:var(--ok)!important;color:#fff!important}
.spin{display:inline-block;width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:rot .7s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
.tick{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.tick path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .45s .05s var(--expo) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.ripple{position:absolute;border-radius:50%;pointer-events:none;background:currentColor;opacity:.22;transform:scale(0)}
.cost{font-family:var(--f-mono);font-size:.74rem;color:var(--faint)}
.back{align-self:flex-start;border:0;background:none;color:var(--muted);cursor:pointer;font-size:.9rem;padding:4px 0;display:inline-flex;gap:8px;align-items:center}
.back:hover{color:var(--ink)}

/* Campos */
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field label,.lbl{font-size:.78rem;font-weight:600;color:var(--muted);letter-spacing:.01em}
.input{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px;font-size:1rem;transition:border-color .25s,box-shadow .25s}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
textarea.input{resize:vertical;min-height:96px;line-height:1.5}
.big{position:relative}
.big input,.big textarea{width:100%;border:0;border-bottom:2px solid var(--line);background:transparent;padding:10px 0 14px;font-size:clamp(1.3rem,3vw,1.9rem);font-weight:500;letter-spacing:-.02em;outline:none;resize:none;line-height:1.3}
.big::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .6s var(--expo)}
.big:focus-within::after{transform:scaleX(1)}
.big input::placeholder,.big textarea::placeholder{color:var(--faint);opacity:.7}
.field.err .input,.field.err .big input,.field.err .big textarea,.field.err .chips-in{border-color:var(--bad)}
.field.err{animation:shake .45s}
.hint{font-size:.82rem;color:var(--faint)}
.chips-in{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0 12px;border-bottom:2px solid var(--line);cursor:text}
.chips-in input{flex:1;min-width:160px;border:0;background:transparent;outline:none;font-size:1.1rem;padding:6px 0}
.tag{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 6px 0 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:500;font-size:.9rem;animation:pop .45s var(--spring)}
.tag button{width:22px;height:22px;border-radius:50%;border:0;background:transparent;color:inherit;cursor:pointer;font-size:1rem;line-height:1}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.seg{position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:4px;border-radius:999px;background:var(--sunk);align-self:flex-start}
.seg button{position:relative;z-index:1;border:0;background:none;padding:9px 18px;cursor:pointer;font-weight:500;font-size:.9rem;color:var(--muted);transition:color .3s;border-radius:999px}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg .thumb{position:absolute;top:4px;bottom:4px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);transition:left .5s var(--expo),width .5s var(--expo)}
.otp{display:flex;gap:10px}
.otp input{width:56px;height:68px;text-align:center;font-size:1.8rem;font-weight:600;border-radius:14px;border:1px solid var(--line);background:var(--surface);transition:border-color .2s,transform .3s var(--spring),box-shadow .2s}
.otp input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);transform:translateY(-2px)}
.otp input.filled{border-color:var(--ink)}

/* Selección grande */
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.choice{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 20px;border-radius:16px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;font-size:1.02rem;font-weight:500;
  transition:transform .4s var(--spring),border-color .3s,background .3s,box-shadow .3s,color .3s}
.choice:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.choice .mono{font-size:.75rem;color:var(--faint)}
.choice.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.choice.on .mono{color:inherit;opacity:.7}

/* Fuentes y credenciales */
.src{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:18px 20px;border-radius:16px;border:1px solid var(--line);background:var(--surface);transition:border-color .3s}
.src b{font-weight:600}
.src p{font-size:.88rem;color:var(--muted)}
.src.off b,.src.off>div>p:first-of-type{opacity:.6}
.switch{position:relative;width:46px;height:28px;border-radius:999px;border:0;background:var(--line);cursor:pointer;transition:background .35s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .45s var(--spring)}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
.switch:disabled{opacity:.4;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:.72rem;font-weight:600;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.req{background:var(--accent-soft);color:var(--accent)} .badge.off{background:var(--sunk);color:var(--muted)}
.badge.ok::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.cred{display:flex;flex-direction:column;gap:14px;padding:22px;border-radius:18px;border:1px solid var(--line);background:var(--surface);transition:border-color .4s,box-shadow .4s}
.cred.focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.cred.connected{background:var(--raised)}
.cred-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .55s var(--expo),opacity .4s}
.cred-body>div{overflow:hidden;display:flex;flex-direction:column;gap:12px;min-height:0}
.cred.connected .cred-body{grid-template-rows:0fr;opacity:0}
.cred.connected.edit .cred-body{grid-template-rows:1fr;opacity:1}
.secret{position:relative}
.secret .input{padding-right:70px;font-family:var(--f-mono);font-size:.9rem}
.secret button{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);cursor:pointer;padding:6px 8px;font-size:.78rem}
.progress-line{height:4px;border-radius:4px;background:var(--sunk);overflow:hidden}
.progress-line i{display:block;height:100%;background:var(--ink);border-radius:4px;transition:width .8s var(--expo)}

/* Escaneo */
.scan{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:40px;align-items:center}
.counter{font-family:var(--f-serif);font-size:clamp(5rem,14vw,9.5rem);line-height:.85;letter-spacing:-.03em}
.counter small{display:block;font-family:var(--f-ui);font-size:1rem;letter-spacing:0;color:var(--muted);margin-top:14px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:14px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow b{font-weight:600}
.srow .st{font-size:.84rem;color:var(--muted);grid-column:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .n{grid-row:1/3;grid-column:2;align-self:center;font-family:var(--f-mono);font-size:1.25rem}
.srow .track{grid-column:1/-1;height:2px;background:var(--line);border-radius:2px;overflow:hidden;position:relative}
.srow .track i{position:absolute;inset:0 auto 0 0;width:0;background:var(--ink);transition:width .8s var(--expo)}
.srow.run .track i{width:35%;animation:slide 1.3s var(--expo) infinite}
.srow.ok .track i{width:100%;background:var(--ok)}
.srow.err .track i{width:100%;background:var(--bad)}
.srow.err .st{color:var(--bad);white-space:normal}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(300%)}}

/* Tendencias */
.trends{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.trend{position:relative;display:flex;flex-direction:column;gap:14px;padding:22px;border-radius:20px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);
  transition:transform .5s var(--expo),box-shadow .4s,border-color .3s}
.trend::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .4s;
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--accent) 9%,transparent),transparent 50%)}
.trend:hover{box-shadow:var(--shadow-lift)}
.trend:hover::after{opacity:1}
.trend.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow-lift)}
.t-top{display:flex;gap:16px;align-items:center}
.ring{position:relative;width:62px;height:62px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:var(--sunk)} .ring .fg{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:163.4;stroke-dashoffset:163.4;transition:stroke-dashoffset 1.4s var(--expo)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.1rem;font-weight:700;font-variant-numeric:tabular-nums}
.trend h3{font-size:1.08rem;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.stage-t{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.stage-t.emergente{color:var(--ok)} .stage-t.pico{color:var(--accent)} .stage-t.estable{color:var(--muted)} .stage-t.saturada{color:var(--warn)}
.why{font-size:.92rem;color:var(--muted)}
.angle{font-size:.9rem;padding:12px 14px;border-radius:12px;background:var(--raised);border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;background:var(--sunk);font-size:.76rem;color:var(--muted);font-weight:500;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.src-c{background:var(--accent-soft);color:var(--accent)}
details.ev summary{cursor:pointer;font-size:.84rem;font-weight:600;color:var(--muted);list-style:none;display:flex;align-items:center;gap:8px}
details.ev summary::-webkit-details-marker{display:none}
details.ev summary::before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .3s var(--expo)}
details.ev[open] summary::before{transform:rotate(45deg)}
details.ev ul{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:.84rem}
details.ev li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px}
details.ev li .s{font-family:var(--f-mono);font-size:.74rem;color:var(--accent)}
details.ev a{color:var(--ink);text-decoration-color:var(--line)}
.trend .btn{margin-top:auto;align-self:flex-start}
.pinned{display:inline-flex;align-items:center;gap:12px;padding:8px 18px 8px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);max-width:100%}
.pinned .ring{width:38px;height:38px} .pinned .ring b{font-size:.74rem} .pinned .ring circle{stroke-width:6}

<script>
/* ===================================================================
   Conexión con el servidor
   - Servida por Apps Script: google.script.run
   - Alojada en otro dominio: POST a la URL /exec del Web App
   =================================================================== */
const IS_GAS = !!(window.google && google.script && google.script.run);
const store = {
  get(k){try{return JSON.parse(localStorage.getItem('pulso_'+k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem('pulso_'+k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem('pulso_'+k)}catch(e){}}
};
const sess = {
  get(k){try{return JSON.parse(sessionStorage.getItem('pulso_'+k))}catch(e){return null}},
  set(k,v){try{sessionStorage.setItem('pulso_'+k,JSON.stringify(v))}catch(e){}},
  del(k){try{sessionStorage.removeItem('pulso_'+k)}catch(e){}}
};
let API_URL = store.get('api_url') || '';

function call(action, payload = {}) {
  const req = Object.assign({ action, token: S.token }, payload);
  if (IS_GAS) return new Promise((res, rej) => google.script.run
    .withSuccessHandler(r => r && r.ok ? res(r) : rej(new Error(r ? r.error : 'El servidor no respondió.')))
    .withFailureHandler(e => rej(new Error(e && e.message || String(e)))).api(JSON.stringify(req)));
  if (!API_URL) return Promise.reject(new Error('Conecta primero tu servidor.'));
  return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(req) })
    .then(r => r.json(), () => { throw new Error('No pudimos conectar con el servidor. Revisa la URL y que el Web App permita acceso a cualquier usuario.'); })
    .then(r => { if (!r.ok) throw new Error(r.error); return r; });
}
async function poll(action, payload, onTick, every = 3000, max = 160) {
  for (let i = 0; i < max; i++) { const r = await call(action, payload); if (r.done) return r; onTick && onTick(r, i); await sleep(every); }
  throw new Error('La operación tardó más de lo esperado. Vuelve a intentarlo en unos minutos.');
}

/* ===================================================================
   Estado y utilidades
   =================================================================== */
const S = { token: null, user: null, cfg: null, creds: null, project: null, step: 1, inPipeline: false, scan: null, q: { geo: '', niche: '', keywords: [] }, srcOn: new Set(), draft: {}, picked: new Set(), take: {}, jobs: {}, dataUrls: {}, genScript: false, autoScript: false, tab: 'copies', beat: 0, playing: null };
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const pad = n => String(n).padStart(2, '0');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const fmtN = n => Math.round(n).toLocaleString('es-CR');
const elapsed = t0 => { const s = Math.floor((Date.now() - t0) / 1000); return pad(Math.floor(s / 60)) + ':' + pad(s % 60); };
const OBJ = { atraer: 'Atraer', convertir: 'Convertir', cerrar: 'Cerrar venta' };
const ICON = {
  check: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2.5 6.3l2.3 2.3L9.5 3.8"/></svg>',
  play: '<svg viewBox="0 0 12 12"><path d="M2 1l9 5-9 5z"/></svg>'
};
const GEO = { CR: 'Costa Rica', MX: 'México', CO: 'Colombia', PA: 'Panamá', GT: 'Guatemala', SV: 'El Salvador', DO: 'Rep. Dominicana', EC: 'Ecuador', PE: 'Perú', CL: 'Chile', AR: 'Argentina', ES: 'España', US: 'Estados Unidos' };
const SRC = {
  google_trends: { n: 'Google Trends', d: 'Búsquedas que más crecen hoy en el país.' },
  youtube: { n: 'YouTube', d: 'Lo más visto del país y Shorts de tu nicho, con vistas por hora.' },
  openai_web: { n: 'Búsqueda web con OpenAI', d: 'Tendencias de TikTok, Reels, Shorts y LinkedIn con fuentes citadas.' },
  tiktok_apify: { n: 'TikTok', d: 'Videos por hashtag con reproducciones y audio, vía Apify.' },
  reddit: { n: 'Reddit', d: 'Conversaciones más votadas de la semana en marketing.' }
};
const STEPS = ['Tendencias', 'Brief', 'Guion', 'Producción', 'Publicación'];

/* ===================================================================
   Movimiento
   - Entrada de pantalla: la cámara se acerca y enfoca (desenfoque → nítido)
   - Títulos que suben línea por línea desde una máscara
   - Morph de la tarjeta elegida hacia la siguiente pantalla
   - Ondas al presionar, inclinación con luz, contadores
   =================================================================== */
function H(text, cls = '') {
  const lines = text.split('|').map(l => `<span class="ln"><span>${esc(l).replace(/\*(.+?)\*/g, '<em>$1</em>')}</span></span>`).join('');
  return `<h1 class="hl ${cls}">${lines}</h1>`;
}
let queue = Promise.resolve(), ghost = null;
function show(build, { dir = 1, flipFrom = null } = {}) {
  closeMenu();
  if (flipFrom && !reduced) ghost = makeGhost(flipFrom);
  queue = queue.then(async () => {
    const stage = $('#stage'), old = stage.firstElementChild;
    if (old) {
      if (!reduced) await old.animate([{ opacity: 1, transform: 'none', filter: 'blur(0)' }, { opacity: 0, transform: `translateY(${-28 * dir}px) scale(.97)`, filter: 'blur(8px)' }], { duration: 340, easing: 'cubic-bezier(.7,0,.84,0)', fill: 'forwards' }).finished;
      old.remove();
    }
    const el = document.createElement('section'); el.className = 'screen';
    stage.appendChild(el);
    renderTop();
    build(el);
    window.scrollTo({ top: 0 });
    enter(el, dir);
    if (ghost) { const g = ghost; ghost = null; flyGhost(g, el); }
    renderDock();
  }).catch(e => { console.error(e); toast(e.message, true); });
  return queue;
}
function enter(el, dir = 1) {
  if (reduced) return;
  el.animate([{ opacity: 0, transform: `translateY(${44 * dir}px) scale(1.015)`, filter: 'blur(14px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }], { duration: 900, easing: 'cubic-bezier(.16,1,.3,1)' });
  $$('.hl .ln > span', el).forEach((s, i) => s.animate([{ transform: 'translateY(110%) rotate(2deg)' }, { transform: 'none' }], { duration: 1000, delay: 120 + i * 90, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'backwards' }));
  $$('[data-r]', el).forEach((s, i) => s.animate([{ opacity: 0, transform: 'translateY(22px)', filter: 'blur(6px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }], { duration: 850, delay: 260 + i * 70, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'backwards' }));
}

  return { g, r };
}

  const target = $('[data-flip]', screen);
  if (!target) { g.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300 }).finished.then(() => g.remove()); return; }
  const t = target.getBoundingClientRect();
  const dx = t.left - r.left, dy = t.top - r.top, sx = t.width / r.width, sy = t.height / r.height;

  g.animate([{ transform: 'none', opacity: 1 }, { opacity: .9, offset: .5 }, { transform: `translate(${dx}px,${dy}px) scale(${sx},${sy})`, opacity: 0 }], { duration: 850, easing: 'cubic-bezier(.65,0,.15,1)', fill: 'forwards' }).finished.then(() => g.remove());
  target.animate([{ opacity: 0, transform: 'scale(.9)' }, { opacity: 1, transform: 'none' }], { duration: 650, delay: 450, easing: 'cubic-bezier(.34,1.56,.64,1)', fill: 'backwards' });
}
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('.btn,.choice,.seg-b,.sum'); if (!b || b.disabled || reduced) return;
  const r = b.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2.2, s = document.createElement('span');
  s.className = 'ripple'; Object.assign(s.style, { width: d + 'px', height: d + 'px', left: e.clientX - r.left - d / 2 + 'px', top: e.clientY - r.top - d / 2 + 'px' });
  b.appendChild(s); s.animate([{ transform: 'scale(0)', opacity: .25 }, { transform: 'scale(1)', opacity: 0 }], { duration: 700, easing: 'cubic-bezier(.16,1,.3,1)' }).finished.then(() => s.remove());
});
document.addEventListener('pointermove', e => {
  const c = e.target.closest('.trend'); if (!c || reduced || e.pointerType !== 'mouse') return;
  const r = c.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;

/** Botón con estados: cargando → hecho (marca dibujada) o error (sacudida). */
async function act(btn, fn, doneLabel) {
  const html = btn.innerHTML, w = btn.offsetWidth;
  btn.style.width = w + 'px'; btn.classList.add('is-busy'); btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  try {
    const r = await fn();
    btn.classList.remove('is-busy'); btn.classList.add('is-done'); btn.style.width = '';
    btn.innerHTML = `<svg class="tick" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>${doneLabel ? `<span>${esc(doneLabel)}</span>` : ''}`;
    await sleep(reduced ? 200 : 700);

    if (!reduced) btn.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'translateX(0)' }], { duration: 380 });

}

}

/* ===================================================================
   Navegación del estudio
   =================================================================== */
function goStep(n, opts = {}) {
  if (!unlocked(n)) { toast(`Completa primero «${STEPS[stage()]}».`); return Promise.resolve(); }
  const dir = opts.dir || (n >= S.step ? 1 : -1);
  S.step = n; S.inPipeline = true;
  const views = {
    1: () => S.scan && S.scan.trends ? v1Results : v1Market,
    2: () => (stage() >= 2 && S.project.brief && opts.page === undefined) ? v2Summary : (el => v2Page(el, opts.page || 0)),
    3: () => v3Script, 4: () => v4Production, 5: () => stage() >= 5 ? v5Done : v5Publish
  };
  return show(views[n](), { dir, flipFrom: opts.flipFrom });
}

const WRITING = ['Leyendo la evidencia de la tendencia', 'Cruzando el dolor de tu cliente con el formato', 'Escribiendo tres hooks distintos', 'Cronometrando la escaleta', 'Redactando copies y la respuesta al DM', 'Componiendo los prompts de cada escena', 'Diseñando las láminas del carrusel'];

/* ---------- Paso 4 · Producción ---------- */
const ENG = { openai: 'OpenAI', nanobanana: 'Nano Banana', veo: 'Veo' };
function takesFor(ref) { return S.project.assets.filter(a => a.ref === ref); }

  else media = `<img src="${esc(S.dataUrls[a.id] || a.url)}" alt="${esc(a.label)}">`;
  const acts = kind === 'v'
    ? `<button class="btn" data-img="nanobanana" data-type="scene" data-i="${i}" ${eng.nanobanana && !job ? '' : 'disabled'}>Fotograma · ${c.image_nanobanana}</button><button class="btn ${takes.some(t => t.kind === 'image') ? 'accent' : ''}" data-vid="${i}" ${eng.veo && !job ? '' : 'disabled'}>Clip · ${c.video_veo}</button>`

  return `<div class="tile ${kind} ${picked ? 'picked' : ''}" data-ref="${ref}">
    <div class="frame">${media}
      ${a ? `<button class="pick" data-pickid="${a.id}" aria-pressed="${!!picked}" aria-label="Elegir para publicar">${ICON.check}</button>` : ''}

    </div>
    <div class="meta"><span>${kind === 'v' ? 'Escena' : 'Lámina'} ${i + 1}</span><span>${a ? ENG[a.engine] || '' : ''}</span></div>
    <div class="acts">${acts}</div></div>`;
}
function v4Production(el) {
  const s = S.project.script;

  el.addEventListener('click', e => {
    const im = e.target.closest('[data-img]'); if (im && !im.disabled) return shootImage(im.dataset.img, im.dataset.type, +im.dataset.i);
    const v = e.target.closest('[data-vid]'); if (v && !v.disabled) return shootVideo(+v.dataset.vid);

      pk.setAttribute('aria-pressed', on); pk.closest('.tile').classList.toggle('picked', on);
      if (!reduced) pk.animate([{ transform: 'scale(.7)' }, { transform: 'scale(1.25)' }, { transform: on ? 'scale(1.1)' : 'scale(1)' }], { duration: 450, easing: 'cubic-bezier(.34,1.56,.64,1)' });
      renderDock(); return;
    }
    const tk = e.target.closest('[data-take]'); if (tk) { const ref = tk.closest('.tile').dataset.ref; S.take[ref] = +tk.dataset.take; redrawTile(ref, true); return; }

}
function redrawTile(ref, reveal) {
  const t = $(`.tile[data-ref="${ref}"]`); if (!t) return;
  const [kind, i] = ref.split('-'), s = S.project.script, data = kind === 'scene' ? s.video.scenes[+i] : s.carousel.items[+i];
  const tmp = document.createElement('div'); tmp.innerHTML = tileHTML(kind === 'scene' ? 'v' : 'c', +i, data); const nt = tmp.firstElementChild;
  t.replaceWith(nt);
  if (reveal && !reduced) { const m = $('.frame img', nt); if (m) m.animate([{ clipPath: 'inset(0 0 100% 0)', filter: 'blur(16px)', transform: 'scale(1.12)' }, { clipPath: 'inset(0 0 0 0)', filter: 'blur(0)', transform: 'scale(1)' }], { duration: 1300, easing: 'cubic-bezier(.16,1,.3,1)' }); }
}
setInterval(() => Object.keys(S.jobs).forEach(ref => { const e = $(`[data-jt="${ref}"]`); if (e) e.textContent = elapsed(S.jobs[ref].t0); }), 1000);
function renderDock() {

}
async function shootImage(engine, type, i) {

async function batch(kind, btn) {

      <div class="funnel" id="funnel"></div><div><span class="lbl">Ingreso estimado con tus supuestos</span><div class="money num" id="money">$0</div></div></div>

}
function drawFunnel() {
  if (!$('#funnel')) return;
  const v = id => +$('#' + id).value || 0, n = Math.max(1, S.project.approved.length);
  const reach = n * v('f_reach'), c = reach * v('f_kw') / 100, l = c * v('f_lead') / 100, s = l * v('f_close') / 100;
  const mx = Math.log10(reach + 1) || 1;
  $('#funnel').innerHTML = [['Alcance', reach], ['Comentan la clave', c], ['Leads', l], ['Ventas', s]].map(([k, x]) => `<div class="fstep"><span>${k}</span><div class="fbar"><i data-w="${Math.max(2, Math.log10(x + 1) / mx * 100)}"></i></div><span class="num">${fmtN(x)}</span></div>`).join('');
  requestAnimationFrame(() => requestAnimationFrame(() => $$('#funnel i').forEach(i => i.style.width = i.dataset.w + '%')));
  const m = $('#money'), to = s * v('f_ticket');
  if (reduced) { m.textContent = '$' + fmtN(to); return; }
  const from = +m.dataset.v || 0, t0 = performance.now(); m.dataset.v = to;
  (function f(t) { const k = Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - k, 4); m.textContent = '$' + Math.round(from + (to - from) * e).toLocaleString('en-US'); if (k < 1) requestAnimationFrame(f); })(t0);
}
